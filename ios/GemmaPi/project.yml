name: GemmaPi
options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  LiteRTLM-Swift:
    url: https://github.com/mylovelycodes/LiteRTLM-Swift.git
    branch: main
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    exactVersion: 4.8.6
  LocalMediaPipeTasks:
    path: LocalMediaPipe
targets:
  GemmaPi:
    type: application
    platform: iOS
    sources:
      - GemmaPiApp
    dependencies:
      - package: LiteRTLM-Swift
        product: LiteRTLMSwift
      - package: SWCompression
        product: SWCompression
      - package: LocalMediaPipeTasks
        product: MediaPipeTasksCommon
      - package: LocalMediaPipeTasks
        product: MediaPipeTasksVision
      - framework: LocalLlama/llama.framework
        embed: true
        codeSign: true
      - framework: LocalSherpaOnnx/sherpa-onnx.xcframework
      - framework: LocalSherpaOnnx/onnxruntime.xcframework
    info:
      path: GemmaPiApp/Info.plist
      properties:
        CFBundleDisplayName: Gemma Inference Server
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: Connect to the Raspberry Pi bridge that sends local Gemma requests to this iPhone.
        NSMicrophoneUsageDescription: Record local audio prompts for direct on-device Gemma audio input.
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gemma4robot.gemmapi
        DEVELOPMENT_TEAM: HT74ZXZB82
        PRODUCT_NAME: GemmaPi
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: GemmaPi.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        FRAMEWORK_SEARCH_PATHS: $(inherited) LocalLlama LocalSherpaOnnx
        HEADER_SEARCH_PATHS: $(inherited) "$(SRCROOT)/LocalSherpaOnnx/include"
        SWIFT_OBJC_BRIDGING_HEADER: GemmaPiApp/SherpaOnnxBridge.h
        OTHER_LDFLAGS: $(inherited) -ObjC -lc++ -framework AVFoundation -framework Accelerate -framework AssetsLibrary -framework CoreFoundation -framework CoreGraphics -framework CoreImage -framework CoreMedia -framework CoreVideo -framework QuartzCore
        OTHER_LDFLAGS[sdk=iphoneos*]: $(inherited) -force_load "$(SRCROOT)/LocalMediaPipe/Artifacts/MediaPipeTasksCommonGraph/libMediaPipeTasksCommon_device_graph.a"
        OTHER_LDFLAGS[sdk=iphonesimulator*]: $(inherited) -force_load "$(SRCROOT)/LocalMediaPipe/Artifacts/MediaPipeTasksCommonGraph/libMediaPipeTasksCommon_simulator_graph.a"
    postBuildScripts:
      - name: Embed LiteRT-LM dylibs
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/CLiteRTLM.framework/libGemmaModelConstraintProvider.dylib
          - $(BUILT_PRODUCTS_DIR)/CLiteRTLM.framework/libGemmaModelConstraintProvider.dylib
          - $(SRCROOT)/LocalLiteRT/ios_arm64/libLiteRtMetalAccelerator.dylib
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libGemmaModelConstraintProvider.dylib
          - $(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libLiteRtMetalAccelerator.dylib
        script: |
          "${SRCROOT}/scripts/embed_litert_dylibs.sh"
    scheme:
      testTargets: []
